# Primary data pipeline: chỉ API free → public/data/live.json
# (bước lấp field bằng LLM đã tắt — xem automation/README.md)
# This is the system of record for daily data. The local agent (automation/run_agent_daily.ps1)
# is a manual/backup tool only — it never pushes to main directly, it opens a PR instead.
#
# NOTE: git-auto-commit-action pushes using the default GITHUB_TOKEN — GitHub
# deliberately does not let GITHUB_TOKEN-authored pushes trigger other
# workflows (anti-recursion guard), so this commit does NOT auto-fire
# deploy.yml's `on: push` even though deploy.yml watches branch main.
# Verified directly: past auto-commits here (e.g. 7830277 on 2026-08-14) have
# no matching "Build and deploy to Pages" run — the site only caught up when
# a real push happened to follow. The last step below closes that gap by
# explicitly dispatching deploy.yml.
name: Daily market data update

on:
  schedule:
    # Sau phiên VN ~16:00 ICT = 09:00 UTC (T2–T6)
    - cron: "0 9 * * 1-5"
    # Morning pack ~08:15 ICT = 01:15 UTC (T2–T6)
    - cron: "15 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write # cần để gọi workflow_dispatch cho deploy.yml ở bước cuối

concurrency:
  group: daily-market-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # KHÔNG truyền khoá LLM nữa: bước lấp field bằng API đã TẮT mặc định từ
      # 2026-09-30 (nó không sản xuất gì suốt 6 tuần và có lịch sử đóng băng số
      # — xem docstring fetch_llm_auto_fill). Việc lấp field giờ do agent local
      # `run_agent_daily.ps1` làm, chạy miễn phí bằng Max subscription và tìm
      # nguồn thật bằng WebSearch.
      # Muốn bật lại đường API: thêm secret ANTHROPIC_API_KEY và LLM_FILL=1,
      # và đặt LẠI khối `env:` ở đây — một `env:` rỗng làm cả file không parse
      # được, và GitHub vẫn hiện workflow là "active" nên không ai thấy.
      - name: Fetch APIs (chỉ nguồn free)
        run: python automation/daily_update.py

      - name: Commit & push snapshot
        id: autocommit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: daily market snapshot (auto)"
          file_pattern: >-
            public/data/live.json
            public/data/last-run.json
            public/data/grok-fill.json
            public/data/history/*.jsonl
            public/data/history/index.json
            public/data/news-raw.json
            public/data/world-live.json
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Trigger Pages redeploy
        if: steps.autocommit.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main

      # Pipeline hỏng mà không ai biết là cách một hệ thống "đúng" trở thành sai
      # trên thực tế: trang vẫn hiện số cũ với as-of cũ, hoàn toàn trung thực, và
      # không có gì leo thang. Trước bước này, không workflow nào có một dòng
      # `if: failure()` — hỏng là im lặng.
      #
      # Mở issue thay vì gửi mail: nó nằm ngay trong repo, và tìm-hay-tạo tránh
      # đẻ ra hàng chục issue giống nhau khi hỏng nhiều ngày liên tiếp.
      - name: Báo hỏng bằng issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `pipeline hỏng: ${context.workflow}`;
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Workflow **${context.workflow}** thất bại lúc ${new Date().toISOString()}.`,
              ``,
              `Log: ${url}`,
              ``,
              `Trong lúc chưa sửa, trang vẫn hiển thị dữ liệu của phiên gần nhất lấy được`,
              `— số đúng, nhưng cũ. Nhãn as-of trên trang cho biết cũ tới đâu.`,
            ].join("\n");
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "pipeline",
            });
            const hit = open.data.find(i => i.title === title);
            if (hit) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: hit.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["pipeline"],
              });
            }
