# Gộp mọi thứ cần vnstock (+pandas) vào MỘT workflow — sector-flows, cashout,
# và vn_insight đều dùng cùng nguồn (VCI qua vnstock), nên cài đặt 1 lần, chạy
# nối tiếp 3 script, commit chung 1 lần, trigger deploy 1 lần — thay vì nhiều
# workflow rời rạc (cài vnstock nhiều lần, nhiều commit, nhiều lần trigger deploy).
#
# Bước cuối chạy compute_regime.py (automation/vn_regime/, STDLIB-ONLY —
# không cần cài gì thêm) ngay sau 3 fetch trên, đọc lại chính JSON vừa ghi để
# tính 4 điểm số regime + tích luỹ vào history/regime-<year>.jsonl. Đặt ở đây
# thay vì workflow riêng vì nó phụ thuộc trực tiếp vào output của các bước
# trên trong cùng lần chạy.
#
# Tách khỏi data-update.yml (cố tình chỉ dùng thư viện chuẩn Python, xem
# automation/README.md) — đó là pipeline "miễn phí, không phụ thuộc" cho dữ
# liệu lõi (VN-Index/DXY/lợi suất/tin tức); đây là pipeline riêng cho các
# trang bổ sung cần vnstock.
#
# LƯU Ý: git-auto-commit-action push bằng GITHUB_TOKEN mặc định — GitHub cố
# tình không cho push bằng GITHUB_TOKEN tự kích hoạt workflow khác (chặn vòng
# lặp đệ quy), nên bước cuối phải chủ động gọi workflow_dispatch cho
# deploy.yml (xem ghi chú tương tự trong data-update.yml, đã kiểm chứng trực
# tiếp là cần thiết — thiếu bước này thì repo có dữ liệu mới nhưng trang live
# không tự cập nhật).
name: VN vnstock data update (sector flows + cashout + insight + regime)

on:
  schedule:
    # 16:30 ICT = 09:30 UTC (T2–T6) — cố tình chạy SAU vòng data-update.yml
    # buổi chiều (16:00 ICT), không phải ngay lúc HOSE đóng cửa (15:00 ICT)
    # như trước. fetch_cashout_data.py đọc public/data/live.json để lấy field
    # "proprietary" (tự doanh, agent-sourced) — merge chỉ nhận khi asof của
    # live.json khớp đúng phiên hôm nay, nên nếu chạy trước 16:00 ICT thì
    # live.json luôn là của hôm qua và proprietaryNetBn sẽ luôn "missing".
    - cron: "30 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write # cần để gọi workflow_dispatch cho deploy.yml ở bước cuối

concurrency:
  group: vn-vnstock-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # vnstock + vnai KHÔNG còn trên PyPI. Đo ngày 2026-09-29:
      #   pypi.org/pypi/vnstock/json -> HTTP 404   (vnai cũng 404)
      #   pypi.org/pypi/pandas/json  -> HTTP 200   (đối chứng: PyPI vẫn bình thường)
      # Dự án đã chuyển hai gói này sang kho riêng, các phụ thuộc khác vẫn ở
      # PyPI — đúng như README của chính vnstock hướng dẫn. Đó là lý do
      # workflow này đỏ từ 2026-09-25 (lần xanh cuối 09-24), và vì sao
      # regime/cashout/sector-flows đứng im 5 ngày trên trang.
      #
      # Giải thật đã kiểm (--dry-run --ignore-installed, 2026-09-29):
      #   39 gói · vnstock 4.0.9 + vnai 2.6.2 <- vnstocks · pandas/numpy <- pypi
      #
      # Thử lại 3 lần: bước này trước đây không có retry (chỉ các bước fetch
      # có), nên một trục trặc mạng lúc cài là cả pipeline chết im.
      - name: Install dependencies (dùng chung cho cả 3 script — cùng vnstock+pandas)
        run: |
          for i in 1 2 3; do
            pip install --extra-index-url https://vnstocks.com/api/simple \
                -r automation/vn_cashout/requirements.txt && break
            echo "::warning::pip install thất bại lần $i/3 — thử lại sau 30s"
            sleep 30
          done
          # Không dựa vào `&& break` để báo thành công: nếu cả 3 lần đều hỏng,
          # vòng lặp vẫn kết thúc với mã 0. Kiểm tra dứt khoát là import được.
          python -c "import vnstock, pandas; print('vnstock', vnstock.__version__ if hasattr(vnstock,'__version__') else '?')" \
            || { echo "::error::không cài được vnstock sau 3 lần"; exit 1; }
          pip list 2>/dev/null | grep -Ei "^(vnstock|vnai|pandas|numpy) " || true

      # Retry 3 lần, cách 30s — lỗi mạng VCI/vnstock tạm thời (đã xảy ra thật:
      # run 2026-08-17 fail đúng bước này vì connect timeout) trước đây làm
      # CẢ pipeline im lặng đứng yên nhiều ngày không ai biết, vì mọi bước
      # sau đều `skipped` khi 1 bước fail và không có gì tự chạy lại. Thử lại
      # tại chỗ vẫn không được thì fail thật (::error:: + exit 1) để Actions
      # báo đỏ rõ ràng, không giả vờ thành công.
      - name: Fetch sector-flows snapshot (10 ngành ICB, tháng & quý)
        run: |
          n=0
          until python automation/sector_flows/fetch_sector_flows.py; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "::error::fetch_sector_flows.py thất bại sau 3 lần thử"
              exit 1
            fi
            echo "Lần $n thất bại, đợi 30s rồi thử lại..."
            sleep 30
          done

      - name: Cách quãng để tránh vượt rate limit vnstock (20 req/phút, tài khoản khách)
        run: sleep 12

      - name: Fetch cashout snapshot (tổng GTGD, khối ngoại, 5 ngành, 4 ticker, room ngoại)
        run: |
          n=0
          until python automation/vn_cashout/fetch_cashout_data.py; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "::error::fetch_cashout_data.py thất bại sau 3 lần thử"
              exit 1
            fi
            echo "Lần $n thất bại, đợi 30s rồi thử lại..."
            sleep 30
          done

      - name: Cách quãng để tránh vượt rate limit vnstock (20 req/phút, tài khoản khách)
        run: sleep 12

      - name: Fetch tín hiệu tổ chức (VN30 futures basis + giao dịch cổ đông lớn/nội bộ, ~32 request)
        run: |
          n=0
          until python automation/vn_insight/fetch_market_insight.py; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "::error::fetch_market_insight.py thất bại sau 3 lần thử"
              exit 1
            fi
            echo "Lần $n thất bại, đợi 30s rồi thử lại..."
            sleep 30
          done

      - name: Compute regime scores + tích luỹ lịch sử (stdlib-only)
        run: |
          n=0
          until python automation/vn_regime/compute_regime.py; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "::error::compute_regime.py thất bại sau 3 lần thử"
              exit 1
            fi
            echo "Lần $n thất bại, đợi 30s rồi thử lại..."
            sleep 30
          done

      - name: Commit & push snapshot
        id: autocommit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: VN sector-flows + cashout + insight + regime snapshot (auto)"
          file_pattern: >-
            public/data/sector-flows.json
            public/data/cashout-vn.json
            public/data/vn-insight.json
            public/data/regime.json
            public/data/history/regime-*.jsonl
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Trigger Pages redeploy
        if: steps.autocommit.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main

      # Pipeline hỏng mà không ai biết là cách một hệ thống "đúng" trở thành sai
      # trên thực tế: trang vẫn hiện số cũ với as-of cũ, hoàn toàn trung thực, và
      # không có gì leo thang. Trước bước này, không workflow nào có một dòng
      # `if: failure()` — hỏng là im lặng.
      #
      # Mở issue thay vì gửi mail: nó nằm ngay trong repo, và tìm-hay-tạo tránh
      # đẻ ra hàng chục issue giống nhau khi hỏng nhiều ngày liên tiếp.
      - name: Báo hỏng bằng issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `pipeline hỏng: ${context.workflow}`;
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Workflow **${context.workflow}** thất bại lúc ${new Date().toISOString()}.`,
              ``,
              `Log: ${url}`,
              ``,
              `Trong lúc chưa sửa, trang vẫn hiển thị dữ liệu của phiên gần nhất lấy được`,
              `— số đúng, nhưng cũ. Nhãn as-of trên trang cho biết cũ tới đâu.`,
            ].join("\n");
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "pipeline",
            });
            const hit = open.data.find(i => i.title === title);
            if (hit) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: hit.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["pipeline"],
              });
            }
